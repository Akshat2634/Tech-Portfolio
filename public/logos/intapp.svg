<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="10%" y1="62%" x2="90%" y2="38%">
      <stop offset="0%"   stop-color="#1A46E0"/>
      <stop offset="24%"  stop-color="#2062E9"/>
      <stop offset="50%"  stop-color="#2492DF"/>
      <stop offset="74%"  stop-color="#33CFD0"/>
      <stop offset="100%" stop-color="#4FF7BE"/>
    </linearGradient>
  </defs>

  <!-- Two rounded squares on the diagonal, overlapped deeply enough that the
       shared area reads as a small centre diamond — the interlocking-links
       motif. One gradient spans both links so the blue-to-mint sweep is
       continuous rather than per-shape. -->
  <g fill="none" stroke="url(#g)" stroke-width="16.5" stroke-linejoin="round">
    <rect x="40" y="55" width="90" height="90" rx="21" transform="rotate(45 85 100)"/>
    <rect x="70" y="55" width="90" height="90" rx="21" transform="rotate(45 115 100)"/>
  </g>
</svg>
